menu:
  home: / || fa fa-home
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive

darkmode: true

# Math Formulas Render Support
math:
  enable: false
  # Default (true) will load mathjax / katex script on demand.
  # That is it only render those page which has `mathjax: true` in Front-matter.
  # If you set it to false, it will load mathjax / katex srcipt EVERY PAGE.
  per_page: false
  engine: mathjax
  # hexo-renderer-pandoc (or hexo-renderer-kramed) required for full MathJax support.
  mathjax:
    enable: true
    per_page: false
    every_page: true
    # See: https://mhchem.github.io/MathJax-mhchem/
    mhchem: true
  # hexo-renderer-markdown-it-plus (or hexo-renderer-markdown-it with markdown-it-katex plugin) required for full Katex support.
  katex:
    enable: false
    # See: https://github.com/KaTeX/KaTeX/tree/master/contrib/copy-tex
    copy_tex: false

codeblock:
  theme:
    light: github
    dark: github-dark
  prism:
    light: prism
    dark: prism-dark
  copy_button:
    enable: true
    # Show text copy result.
    show_result: true
    # Available values: default | flat | mac
    style: mac

custom_file_path:
  style: source/_data/styles.styl

# Giscus comments (https://giscus.app)
# Powered by GitHub Discussions of the Cloudspots/hexo repository.
giscus:
  enable: true
  repo: Cloudspots/hexo
  repo_id: R_kgDOTlDRCw
  category: Announcements
  category_id: DIC_kwDOTlDRC84DCcbb
  # Available values: pathname | url | title | og:title
  mapping: pathname
  # Available values: 0 | 1
  strict: 0
  reactions_enabled: 1
  emit_metadata: 1
  # Available values: light | dark | preferred_color_scheme | ...
  theme: preferred_color_scheme
  # Available values: en | zh-CN
  lang: en
  # Place the comment box above the comments
  input_position: bottom
  # Load the comments lazily
  loading: lazy

